<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyguor AI SOC Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <main class="container">
        <section class="card">
            <header class="page-header">
    <div class="brand-header">
        <img
            src="/static/images/zyguor-logo.png"
            alt="Zyguor"
            class="zyguor-logo"
        >

        <div>
            <h1>Zyguor AI SOC Assistant</h1>

            <p>
                Analyze security alerts using a Rust-based investigation engine
                with structured SOC triage guidance.
            </p>
        </div>
    </div>
</header>
            <form id="alert-form">
                <label for="alert-type">Alert Type</label>

                <input
                    type="text"
                    id="alert-type"
                    name="alert_type"
                    placeholder="Example: Multiple Failed Login Attempts"
                    required
                >

                <label for="raw-alert">Raw Alert</label>

                <textarea
                    id="raw-alert"
                    name="raw_alert"
                    rows="12"
                    placeholder="Paste the security alert here..."
                    required
                ></textarea>

                <button type="submit">
                    Analyze Alert
                </button>
            </form>

            <section class="history-panel">
    <h2>Investigation History</h2>

    <div id="history-list">
        <p>No investigations loaded.</p>
    </div>
</section>

<section id="result" class="result-panel" hidden>
    <h2>Investigation Result</h2>

    <div id="report-header" class="report-header"></div>
    <div id="summary-section"></div>
    <div id="severity-section"></div>
    <div id="confidence-section"></div>
    <div id="mitre-section"></div>
    <div id="knowledge-section"></div>
    <div id="recommendations-section"></div>
    <div id="narrative-section"></div>

    <div class="report-actions">
        <button type="button" id="copy-report">
            Copy Report
        </button>

        <button type="button" id="export-json">
            Export JSON
        </button>
    </div>
</section>
        </section>
    </main>

    <script src="/static/js/app.js?v=14"></script>
</body>
</html>
